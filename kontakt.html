  <header>

  <main>
    <h2>Boka bord</h2>
    <p>Fyll i formuläret så bekräftar vi din bokning inom ett dygn.
      Fält markerade med * är obligatoriska.
    </p>

    <form action="#" method="get">
      <div class="field">
        <label for="name">Namn *</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="field">
        <label for="email">E-postadress *</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="field">
        <label for="phone">Telefon (valfritt)</label>
        <input type="tel" id="phone" name="phone">
      </div>
      <div class="field">
        <label for="date">Datum *</label>
        <input type="date" id="date" name="date" required>
      </div>

      <button type="submit">Skicka bokning</button>


      <!--* TODO 1: fält för namn, e-post, telefon, datum (label + input med for/id) -->
      <!-- TODO 2: rullista för antal personer, textarea för önskemål -->
      <!-- TODO 3: fieldset + legend för kostönskemål och bekräftelsesätt -->
      <!-- TODO 4: samtyckeskryssruta (required) och skickaknapp -->
    </form>

  </main>
